services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@db:5432/fcc_conference
      - PAYLOAD_SECRET=7df8b9a1c2d3e4f5061728394a5b6c7d8e9f0123456789abcdef0123456789ab
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3000
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fcc_conference
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fcc_conference']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
